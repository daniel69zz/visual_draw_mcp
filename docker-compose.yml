services:
  visual-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: visual-mcp:latest
    container_name: visual-mcp
    restart: unless-stopped
    init: true
    # No se publica al exterior: Caddy lo alcanza por la red interna de Compose.
    # El puerto en loopback es solo para depurar desde el propio VPS
    # (curl http://127.0.0.1:4000/health).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      # svgUrl en los resultados apunta aquí; ALLOWED_HOSTS activa la
      # protección DNS-rebinding.
      PUBLIC_URL: https://${MCP_DOMAIN:?define MCP_DOMAIN en .env}
      ALLOWED_HOSTS: ${MCP_DOMAIN}
      # VISUAL_MCP_INLINE_SVG: "1"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: visual-mcp-caddy
    restart: unless-stopped
    depends_on:
      - visual-mcp
    ports:
      - "80:80"      # necesario para el challenge ACME y el redirect a HTTPS
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?define MCP_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # <- aquí viven los certificados: NO borrar
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
