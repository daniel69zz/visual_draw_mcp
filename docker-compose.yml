services:
  visual-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: visual-mcp:latest
    container_name: visual-mcp
    restart: unless-stopped
    init: true
    # No se publica al exterior: Caddy lo alcanza por la red interna de Compose.
    # El puerto en loopback es solo para depurar desde el propio VPS
    # (curl http://127.0.0.1:4000/health).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      # El puerto forma parte de la URL pública, así que svgUrl debe llevarlo.
      PUBLIC_URL: https://${MCP_DOMAIN:?define MCP_DOMAIN en .env}:${MCP_HTTPS_PORT:-500}
      # El header Host llega como "dominio:500" al no ser un puerto estándar;
      # el SDK compara la cadena exacta, así que se admiten ambas formas.
      ALLOWED_HOSTS: ${MCP_DOMAIN}:${MCP_HTTPS_PORT:-500},${MCP_DOMAIN}
      # VISUAL_MCP_INLINE_SVG: "1"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: visual-mcp-caddy
    restart: unless-stopped
    depends_on:
      - visual-mcp
    # 443 y 80 los ocupan otros servicios del VPS: HTTPS va en 500 y el
    # desafío ACME se escucha en 90.
    #
    # El 90 se publica en loopback porque quien recibe el desafío desde
    # internet es el servidor del puerto 80, que lo reenvía a 127.0.0.1:90.
    # Si ese servidor corre dentro de Docker y no en el host, pon
    # MCP_HTTP_BIND=0.0.0.0 en .env para que pueda alcanzarlo.
    ports:
      - "${MCP_HTTP_BIND:-127.0.0.1}:${MCP_HTTP_PORT:-90}:${MCP_HTTP_PORT:-90}"
      - "${MCP_HTTPS_PORT:-500}:${MCP_HTTPS_PORT:-500}"
      - "${MCP_HTTPS_PORT:-500}:${MCP_HTTPS_PORT:-500}/udp"  # HTTP/3
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?define MCP_DOMAIN en .env}
      HTTP_PORT: ${MCP_HTTP_PORT:-90}
      HTTPS_PORT: ${MCP_HTTPS_PORT:-500}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # <- aquí viven los certificados: NO borrar
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
