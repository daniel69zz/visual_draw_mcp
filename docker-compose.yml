services:
  visual-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: visual-mcp:latest
    container_name: visual-mcp
    restart: unless-stopped
    init: true
    # No se publica al exterior: Caddy lo alcanza por la red interna de Compose.
    # El puerto en loopback es solo para depurar desde el propio VPS
    # (curl http://127.0.0.1:4000/health).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      # El puerto forma parte de la URL pública, así que svgUrl debe llevarlo.
      PUBLIC_URL: https://${MCP_DOMAIN:?define MCP_DOMAIN en .env}:${MCP_HTTPS_PORT:-500}
      # El header Host llega como "dominio:500" al no ser un puerto estándar;
      # el SDK compara la cadena exacta, así que se admiten ambas formas.
      ALLOWED_HOSTS: ${MCP_DOMAIN}:${MCP_HTTPS_PORT:-500},${MCP_DOMAIN}
      # VISUAL_MCP_INLINE_SVG: "1"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: visual-mcp-caddy
    restart: unless-stopped
    depends_on:
      - visual-mcp
    # El 443 lo ocupa otro servicio del VPS, así que HTTPS va en el 500.
    # El 80 NO es opcional: es el único desafío ACME que queda disponible
    # (TLS-ALPN exige el 443). Sin el 80 no hay certificado ni renovación.
    ports:
      - "80:80"
      - "${MCP_HTTPS_PORT:-500}:${MCP_HTTPS_PORT:-500}"
      - "${MCP_HTTPS_PORT:-500}:${MCP_HTTPS_PORT:-500}/udp"  # HTTP/3
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:?define MCP_DOMAIN en .env}
      HTTPS_PORT: ${MCP_HTTPS_PORT:-500}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # <- aquí viven los certificados: NO borrar
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
